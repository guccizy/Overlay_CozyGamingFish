<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CozyGamingFish - Just Chatting</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

    <!-- RÉSEAUX SOCIAUX (haut droite, discrets) -->
    <div class="socials-bar">
        <div class="social-pill twitch">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714z"/></svg>
            <span>CozyGamingFish</span>
        </div>
        <div class="social-pill discord">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057.1 18.079.11 18.1.132 18.11a19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/></svg>
            <span>discord.gg/cozy</span>
        </div>
        <div class="social-pill instagram">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 1 0 0 12.324 6.162 6.162 0 0 0 0-12.324zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.406-11.845a1.44 1.44 0 1 0 0 2.881 1.44 1.44 0 0 0 0-2.881z"/></svg>
            <span>@cozygamingfish</span>
        </div>
        <div class="social-pill youtube">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M23.495 6.205a3.007 3.007 0 0 0-2.088-2.088c-1.87-.501-9.396-.501-9.396-.501s-7.507-.01-9.396.501A3.007 3.007 0 0 0 .527 6.205a31.247 31.247 0 0 0-.522 5.805 31.247 31.247 0 0 0 .522 5.783 3.007 3.007 0 0 0 2.088 2.088c1.868.502 9.396.502 9.396.502s7.506 0 9.396-.502a3.007 3.007 0 0 0 2.088-2.088 31.247 31.247 0 0 0 .5-5.783 31.247 31.247 0 0 0-.5-5.805zM9.609 15.601V8.408l6.264 3.602z"/></svg>
            <span>CozyGamingFish</span>
        </div>
        <div class="social-pill twitter">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
            <span>@cozygamingfish</span>
        </div>
        <div class="social-pill tiktok">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/></svg>
            <span>@cozygamingfish</span>
        </div>
    </div>

    <!-- CHAT (gauche, écran maritime 3D) -->
    <div class="chat-panel-wrapper">

        <!-- Cadre décoratif SVG aquatique -->
        <div class="screen-frame">

            <!-- Coin haut gauche -->
            <svg class="corner corner-tl" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M10 110 Q10 10 110 10" stroke="url(#cyanGrad)" stroke-width="3" fill="none" stroke-linecap="round"/>
                <path d="M18 110 Q18 18 110 18" stroke="rgba(0,212,255,0.2)" stroke-width="1.5" fill="none"/>
                <!-- Corail coin -->
                <ellipse cx="22" cy="95" rx="5" ry="12" fill="#FF6B9D" opacity="0.85"/>
                <ellipse cx="16" cy="88" rx="4" ry="9" fill="#FF4D8D" opacity="0.75"/>
                <ellipse cx="30" cy="98" rx="4" ry="8" fill="#FF8CB4" opacity="0.8"/>
                <!-- Algue -->
                <path d="M35 110 Q38 95 32 80 Q36 68 30 55" stroke="#00C9A7" stroke-width="3" fill="none" stroke-linecap="round"/>
                <path d="M42 110 Q46 97 40 84 Q44 70 38 58" stroke="#00A896" stroke-width="2.5" fill="none" stroke-linecap="round"/>
                <!-- Petite étoile de mer -->
                <path d="M55 105 L57 99 L60 105 L54 101 L62 101 Z" fill="#FFD700" opacity="0.9"/>
                <!-- Bulle déco -->
                <circle cx="70" cy="85" r="5" fill="none" stroke="rgba(0,212,255,0.5)" stroke-width="1.5"/>
                <circle cx="68.5" cy="83.5" r="1.2" fill="rgba(255,255,255,0.6)"/>
                <circle cx="58" cy="72" r="3.5" fill="none" stroke="rgba(0,212,255,0.4)" stroke-width="1.2"/>
                <defs>
                    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#00D4FF"/>
                        <stop offset="100%" stop-color="#0088CC"/>
                    </linearGradient>
                </defs>
            </svg>

            <!-- Coin haut droit -->
            <svg class="corner corner-tr" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M110 110 Q110 10 10 10" stroke="url(#cyanGrad2)" stroke-width="3" fill="none" stroke-linecap="round"/>
                <path d="M102 110 Q102 18 10 18" stroke="rgba(0,212,255,0.2)" stroke-width="1.5" fill="none"/>
                <!-- Petit poisson -->
                <ellipse cx="55" cy="40" rx="12" ry="6" fill="#FF7B00" opacity="0.85"/>
                <path d="M43 40 L36 34 L36 46 Z" fill="#FF7B00" opacity="0.85"/>
                <circle cx="62" cy="38" r="2" fill="#1a0a00"/>
                <circle cx="63" cy="37.5" r="0.7" fill="white"/>
                <!-- Bulle -->
                <circle cx="75" cy="30" r="4" fill="none" stroke="rgba(0,212,255,0.45)" stroke-width="1.2"/>
                <circle cx="73.5" cy="28.5" r="1" fill="rgba(255,255,255,0.6)"/>
                <circle cx="85" cy="50" r="6" fill="none" stroke="rgba(0,212,255,0.35)" stroke-width="1.5"/>
                <circle cx="83" cy="48" r="1.5" fill="rgba(255,255,255,0.5)"/>
                <defs>
                    <linearGradient id="cyanGrad2" x1="1" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#00D4FF"/>
                        <stop offset="100%" stop-color="#0088CC"/>
                    </linearGradient>
                </defs>
            </svg>

            <!-- Coin bas gauche -->
            <svg class="corner corner-bl" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M10 10 Q10 110 110 110" stroke="url(#cyanGrad3)" stroke-width="3" fill="none" stroke-linecap="round"/>
                <path d="M18 10 Q18 102 110 102" stroke="rgba(0,212,255,0.2)" stroke-width="1.5" fill="none"/>
                <!-- Gros corail bas -->
                <ellipse cx="50" cy="95" rx="7" ry="18" fill="#FF4D8D" opacity="0.9"/>
                <ellipse cx="40" cy="100" rx="5" ry="13" fill="#FF6B9D" opacity="0.8"/>
                <ellipse cx="62" cy="98" rx="5" ry="14" fill="#C4338C" opacity="0.8"/>
                <ellipse cx="72" cy="105" rx="4" ry="9" fill="#FF8CB4" opacity="0.75"/>
                <!-- Anémone -->
                <circle cx="35" cy="82" r="6" fill="#FF7B00" opacity="0.7"/>
                <circle cx="28" cy="78" r="4" fill="#FF9D3A" opacity="0.7"/>
                <circle cx="42" cy="80" r="4" fill="#FFC060" opacity="0.65"/>
                <!-- Coquillage -->
                <path d="M80 108 Q88 100 95 108 Q88 116 80 108" fill="#C8A882" opacity="0.8"/>
                <path d="M84 108 Q88 103 92 108" stroke="#A0896A" stroke-width="1" fill="none"/>
                <defs>
                    <linearGradient id="cyanGrad3" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#00D4FF"/>
                        <stop offset="100%" stop-color="#FF7B00" stop-opacity="0.6"/>
                    </linearGradient>
                </defs>
            </svg>

            <!-- Coin bas droit -->
            <svg class="corner corner-br" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M110 10 Q110 110 10 110" stroke="url(#cyanGrad4)" stroke-width="3" fill="none" stroke-linecap="round"/>
                <path d="M102 10 Q102 102 10 102" stroke="rgba(0,212,255,0.2)" stroke-width="1.5" fill="none"/>
                <!-- Poisson clown -->
                <ellipse cx="65" cy="90" rx="14" ry="8" fill="#FF6B00" opacity="0.9"/>
                <path d="M51 90 L44 83 L44 97 Z" fill="#FF6B00" opacity="0.9"/>
                <path d="M58 83 Q65 82 72 83" stroke="white" stroke-width="2.5" fill="none"/>
                <path d="M58 97 Q65 98 72 97" stroke="white" stroke-width="2.5" fill="none"/>
                <circle cx="73" cy="88" r="2.5" fill="#1a0a00"/>
                <circle cx="74" cy="87.2" r="0.8" fill="white"/>
                <!-- Bulles poisson -->
                <circle cx="82" cy="74" r="3.5" fill="none" stroke="rgba(0,212,255,0.5)" stroke-width="1.2"/>
                <circle cx="88" cy="62" r="5" fill="none" stroke="rgba(0,212,255,0.4)" stroke-width="1.4"/>
                <circle cx="80.5" cy="72.5" r="0.9" fill="rgba(255,255,255,0.6)"/>
                <!-- Algue -->
                <path d="M30 110 Q33 95 27 80 Q31 65 25 50" stroke="#00C9A7" stroke-width="2.5" fill="none" stroke-linecap="round"/>
                <defs>
                    <linearGradient id="cyanGrad4" x1="1" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#00D4FF"/>
                        <stop offset="100%" stop-color="#FF7B00" stop-opacity="0.5"/>
                    </linearGradient>
                </defs>
            </svg>

            <!-- Bordures latérales top/bottom avec néons -->
            <div class="frame-edge frame-top"></div>
            <div class="frame-edge frame-bottom"></div>
            <div class="frame-edge frame-left"></div>
            <div class="frame-edge frame-right"></div>

            <!-- Bulles animées dans le cadre -->
            <div class="frame-bubbles">
                <div class="fb fb1"></div>
                <div class="fb fb2"></div>
                <div class="fb fb3"></div>
                <div class="fb fb4"></div>
                <div class="fb fb5"></div>
            </div>

            <!-- Contenu chat -->
            <div class="chat-panel">
                <div class="chat-header">
                    <div class="chat-live-dot"></div>
                    <span class="chat-title">Live Chat</span>
                </div>
                <div class="chat-messages" id="chat-messages"></div>
            </div>

        </div><!-- /.screen-frame -->
    </div><!-- /.chat-panel-wrapper -->

    <!-- ZONE ALERTES (sous le chat) -->
    <div class="alert-zone" id="alert-zone" style="display:none;">
        <div class="alert-bubble" id="alert-bubble">
            <div class="alert-icon" id="alert-icon">🐟</div>
            <div class="alert-text" id="alert-text"></div>
        </div>
    </div>

    <!-- NAMEPLATE (nom du streamer, bas centre) -->
    <div class="nameplate">
        <span class="nameplate-text">CozyGamingFish</span>
    </div>

    <!-- BARRE BAS -->
    <div class="bottombar">
        <div class="stat-item">
            <span class="stat-label">👑 Dernier Follow</span>
            <span class="stat-value" id="last-follower">—</span>
        </div>
        <div class="bottombar-brand">
            <span class="brand-fish">🐠</span>
            <span class="brand-wave">~ Just Chatting ~</span>
            <span class="brand-fish" style="animation-delay:0.6s">🐡</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">⭐ Dernier Sub</span>
            <span class="stat-value" id="last-sub">—</span>
        </div>
    </div>

    <!-- Bulles dorées pour les subs -->
    <div id="gold-bubbles-container" style="position:fixed;inset:0;pointer-events:none;z-index:50;"></div>

    <script src="https://cdn.jsdelivr.net/npm/comfy.js@latest/dist/comfy.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
